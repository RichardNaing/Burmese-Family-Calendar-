 const tags=[];
 tags.push(`<span class="bb-tag"><span class="my">${PHASE[i.mp]}</span> · ${PHASE_EN[i.mp]}${i.mp===0||i.mp===2?' '+i.mf:''}</span>`);
 if(i.sab===1)tags.push('<span class="bb-tag gold"><span class="my">ဥပုသ်နေ့</span> · Sabbath</span>');
 if(i.sab===2)tags.push('<span class="bb-tag gold"><span class="my">အဖိတ်နေ့</span> · Sabbath eve</span>');
 i.pub.forEach(p=>tags.push(`<span class="bb-tag red"><span class="my">${esc(p[0])}</span> · ${esc(p[1])}</span>`));
 i.obs.forEach(p=>tags.push(`<span class="bb-tag"><span class="my">${esc(p[0])}</span></span>`));
 i.th.forEach(t=>tags.push(`<span class="bb-tag blue">TH · ${esc(t)}</span>`));
 if(i.yat)tags.push('<span class="bb-tag"><span class="my">ရက်ရာဇာ</span> · Yatyaza</span>');
 if(i.pya)tags.push(`<span class="bb-tag"><span class="my">${i.pya===2?'မွန်းလွဲ':''}ပြဿဒါး</span> · Pyathada</span>`);
 document.getElementById('info').innerHTML=`<div class="my">${WD_MM[i.dow]}နေ့ · ${bn(i.my)} ခု ${lunarLine(i)}</div>
  <div class="en">${GM_EN[m-1].toUpperCase()} ${d}, ${y} · ${lunarEn(i).toUpperCase()} · ME ${i.my} · SASANA ${i.my+1182} · DRAGON HEAD ${DIR_EN[i.naga].toUpperCase()}</div>
  <div class="bb-tags">${tags.join('')}</div>`;
 gridEl.querySelectorAll('.bb-day').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.value===value)));
 sizeBoard();
}
function setValue(k){if(k===value)return;value=k;focusKey=k;gridEl.querySelectorAll('.bb-day').forEach(b=>b.tabIndex=b.dataset.value===k?0:-1);renderCaption()}

// ================= scale to fit =================
function fit(){
 const w=document.getElementById('stage').clientWidth;scale=Math.min(1,w/540);
 const sc=document.getElementById('scaler');sc.style.transform=`scale(${scale})`;sc.style.marginBottom=(FH*scale-FH)+'px';
}
addEventListener('resize',()=>{fit();measure()});

// ================= physics =================
function measure(){
 const box=bb.getBoundingClientRect();
 st.cells=[...gridEl.querySelectorAll('.bb-day[data-value]')].map(d=>{
  const r=d.querySelector('.bb-dimple').getBoundingClientRect(),c=d.getBoundingClientRect();
  return{date:d.dataset.value,x:(r.left+r.width/2-box.left)/scale,y:(r.top+r.height/2-box.top)/scale,l:(c.left-box.left)/scale,t:(c.top-box.top)/scale,r:(c.right-box.left)/scale,b:(c.bottom-box.top)/scale};
 });
 FW=540;
}
function home(drop){
 const i=Math.max(0,st.cells.findIndex(c=>c.date===value));
 st.x=st.cells[i].x;st.y=st.cells[i].y;st.vx=st.vy=st.vz=st.wx=st.wy=0;st.held=false;st.at=i;st.auto=-1;
 if(drop&&!reduce.matches){st.z=CARRY*1.2;st.air=true;st.rest=false}else{st.z=0;st.air=false;st.rest=true}
}
const nearest=(x,y)=>{let index=0,best=Infinity;for(let i=0;i<st.cells.length;i++){const d=(st.cells[i].x-x)**2+(st.cells[i].y-y)**2;if(d<best){best=d;index=i}}return{index,dx:st.cells[index].x-x,dy:st.cells[index].y-y,d:Math.sqrt(best)}};
function turn(ax,ay){const a=Math.hypot(ax,ay);if(a<1e-7)return;const ux=ax/a,uy=ay/a,c=Math.cos(a),s=Math.sin(a),t=1-c;
 const r=[t*ux*ux+c,t*ux*uy,s*uy,t*ux*uy,t*uy*uy+c,-s*ux,-s*uy,s*ux,c],m=st.m,o=new Array(9);
 for(let i=0;i<3;i++)for(let j=0;j<3;j++)o[i*3+j]=r[i*3]*m[j]+r[i*3+1]*m[3+j]+r[i*3+2]*m[6+j];st.m=o}
function step(h){
 if(st.rest)return;
 if(st.held){
  st.vx+=(6400*(st.hx-st.x)-160*st.vx)*h;st.vy+=(6400*(st.hy-st.y)-160*st.vy)*h;st.vz+=(620*(CARRY-st.z)-50*st.vz)*h;
  st.x+=st.vx*h;st.y+=st.vy*h;st.z=Math.max(0,st.z+st.vz*h);const f=Math.exp(-14*h);st.wx*=f;st.wy*=f;
 }else if(st.air){
  st.vz-=G*h;st.x+=st.vx*h;st.y+=st.vy*h;st.z+=st.vz*h;
  if(st.z<=0){st.z=0;const up=-st.vz*BOUNCE;st.vx*=KEEP;st.vy*=KEEP;
   if(up>DEAD)st.vz=up;else{st.vz=0;st.air=false}
   st.wx=-st.vy/R;st.wy=st.vx/R;
   const i=st.cells.findIndex(c=>st.x>=c.l&&st.x<c.r&&st.y>=c.t&&st.y<c.b);
   if(i>=0&&i!==st.at&&st.auto<0){st.at=i;setValue(st.cells[i].date)}}
 }else{
  const n=nearest(st.x,st.y);let ax=0,ay=0,drag=DRAG,flat=true;
  const target=st.auto>=0?st.cells[st.auto]:null,tdst=target?Math.hypot(target.x-st.x,target.y-st.y):0;
  if(target&&tdst>RD*.85){const want=Math.min(540,Math.sqrt(2*720*tdst));ax=13*((want*(target.x-st.x))/tdst-st.vx);ay=13*((want*(target.y-st.y))/tdst-st.vy);
   const a=Math.hypot(ax,ay);if(a>3400){ax*=3400/a;ay*=3400/a}drag=0;flat=false;st.autoT+=h;if(st.autoT>2.5)st.auto=-1;}
  else if(n.d<RD){ax=WELL*n.dx;ay=WELL*n.dy;drag=target?13:WELL_DRAG;flat=false}
  else{ax=(DRAIN*n.dx)/n.d;ay=(DRAIN*n.dy)/n.d}
  const sp=Math.hypot(st.vx,st.vy);
  if(flat&&sp>1){ax-=(RESIST*st.vx)/sp;ay-=(RESIST*st.vy)/sp}
  st.vx+=(ax-drag*st.vx)*h;st.vy+=(ay-drag*st.vy)*h;st.x+=st.vx*h;st.y+=st.vy*h;st.wx=-st.vy/R;st.wy=st.vx/R;
  const e=.5*(st.vx*st.vx+st.vy*st.vy)+.5*WELL*n.d*n.d;
  if(n.d<RD&&e<.45*U_EDGE){st.caught+=h;
   if(st.caught>.06){if(st.auto===n.index)st.auto=-1;
    if(st.at!==n.index&&st.auto<0){st.at=n.index;setValue(st.cells[n.index].date)}
    if(st.auto<0&&n.d<.35&&sp<3){st.x=st.cells[n.index].x;st.y=st.cells[n.index].y;st.vx=st.vy=st.wx=st.wy=0;st.rest=true}}}
  else st.caught=0;
 }
 if(st.x<R){st.x=R;st.vx=st.held?0:Math.abs(st.vx)*WALL}else if(st.x>FW-R){st.x=FW-R;st.vx=st.held?0:-Math.abs(st.vx)*WALL}
 if(st.y<R){st.y=R;st.vy=st.held?0:Math.abs(st.vy)*WALL}else if(st.y>FH-R){st.y=FH-R;st.vy=st.held?0:-Math.abs(st.vy)*WALL}
 const sp=Math.hypot(st.vx,st.vy);if(sp>V_MAX){st.vx*=V_MAX/sp;st.vy*=V_MAX/sp}
 st.vz=clamp(st.vz,-4000,4000);st.z=clamp(st.z,0,400);turn(st.wx*h,st.wy*h);
 if(![st.x,st.y,st.z,st.vx,st.vy,st.vz,...st.m].every(Number.isFinite)){st.m=[1,0,0,0,1,0,0,0,1];home(false)}
}
const ballEl=bb.querySelector('.bb-ball'),grabEl=bb.querySelector('.bb-grab'),shadowEl=bb.querySelector('.bb-shadow'),contactEl=bb.querySelector('.bb-contact');
const ctx=ballEl.getContext('2d');const sphere=makeSphere();
const body=v=>{const m=st.m;return[m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]]};
let drawn='';
function paint(){
 const keyM=st.m.map(v=>v.toFixed(3)).join();if(keyM===drawn)return;drawn=keyM;
 const s=BOX*K,c=s/2,rp=R*K;ctx.clearRect(0,0,s,s);ctx.drawImage(sphere,0,0);ctx.save();ctx.beginPath();ctx.arc(c,c,rp-.5,0,Math.PI*2);ctx.clip();
 for(const [off,style] of [[.45*K,'rgba(0,0,0,0.5)'],[-.3*K,'rgba(255,255,255,0.27)']]){
  ctx.beginPath();let pen=false;
  for(let i=0;i<=72;i++){const t=(i/72)*Math.PI*2,ca=Math.cos(t),sa=Math.sin(t);
   const p=body([SEAM_A[0]*ca+SEAM_B[0]*sa,SEAM_A[1]*ca+SEAM_B[1]*sa,SEAM_A[2]*ca+SEAM_B[2]*sa]);
   if(p[2]<.02){pen=false;continue}const x=c+p[0]*rp+off*.7,y=c+p[1]*rp+off*.7;if(pen)ctx.lineTo(x,y);else ctx.moveTo(x,y);pen=true}
  ctx.strokeStyle=style;ctx.lineWidth=.55*K;ctx.stroke();
 }
 for(const d of DOTS){const p=body(d);if(p[2]<-DOT_R)continue;
  const e1=norm([p[1],-p[0],.0001]),e2=[p[1]*e1[2]-p[2]*e1[1],p[2]*e1[0]-p[0]*e1[2],p[0]*e1[1]-p[1]*e1[0]];
  ctx.beginPath();
  for(let i=0;i<24;i++){const t=(i/24)*Math.PI*2,ca=Math.cos(t)*Math.sin(DOT_R),sa=Math.sin(t)*Math.sin(DOT_R),cz=Math.cos(DOT_R);
   let x=p[0]*cz+e1[0]*ca+e2[0]*sa,y=p[1]*cz+e1[1]*ca+e2[1]*sa;const z=p[2]*cz+e1[2]*ca+e2[2]*sa;
   if(z<0){const l=Math.hypot(x,y)||1;x/=l;y/=l}if(i)ctx.lineTo(c+x*rp,c+y*rp);else ctx.moveTo(c+x*rp,c+y*rp)}
  ctx.closePath();const w=.42+.58*wrapLight(p[0],p[1],Math.max(0,p[2]));
  ctx.fillStyle=`rgb(${Math.round(246*w)},${Math.round(204*w)},${Math.round(22*w)})`;ctx.fill();
 }
 ctx.restore();
}
function draw(ahead){
 const dt=st.rest?0:ahead,x=clamp(st.x+st.vx*dt,R,FW-R),y=clamp(st.y+st.vy*dt,R,FH-R);
 const z=st.air?Math.max(0,st.z+st.vz*dt-.5*G*dt*dt):st.z,k=CAM/(CAM-z),t=`translate(${x.toFixed(2)}px, ${y.toFixed(2)}px)`;
 ballEl.style.transform=`${t} scale(${k.toFixed(4)})`;grabEl.style.transform=t;
 const off=4.5+SHADE*z;
 shadowEl.style.transform=`translate(${(x+off).toFixed(2)}px, ${(y+off).toFixed(2)}px) rotate(45deg) scale(${(1.3+z*.0022).toFixed(4)}, ${(1+z*.0022).toFixed(4)})`;
 shadowEl.style.filter=`blur(${(1.6+z*.07).toFixed(2)}px)`;shadowEl.style.opacity=(.52/(1+z/115)).toFixed(3);
 contactEl.style.transform=`translate(${(x+1.5).toFixed(2)}px, ${(y+1.5).toFixed(2)}px)`;contactEl.style.opacity=clamp(1-z/12,0,1).toFixed(3);
 paint();
}
(function startLoop(){const H=1/120;let last=performance.now(),acc=0;
 const tick=()=>{const now=performance.now();acc+=Math.min(Math.max((now-last)/1000,0),1/30);last=now;while(acc>=H){step(H);acc-=H}draw(acc);requestAnimationFrame(tick)};
 requestAnimationFrame(tick)})();

// ================= input =================
const tracker=(()=>{let s=[];return{reset(){s=[]},push(x,y){const t=performance.now();s.push({t,x,y});s=s.filter(a=>t-a.t<=80)},
 velocity(){const now=performance.now(),r=s.filter(a=>now-a.t<=80);if(r.length<2)return{x:0,y:0};const a=r[0],b=r[r.length-1],dt=(b.t-a.t)/1000;return dt<=0?{x:0,y:0}:{x:(b.x-a.x)/dt,y:(b.y-a.y)/dt}}}})();
const point=e=>{const r=bb.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}};
grabEl.addEventListener('pointerdown',e=>{
 if(e.button!==0)return;e.preventDefault();
 const p=point(e),ox=st.x-p.x,oy=st.y-p.y;
 Object.assign(st,{held:true,rest:false,air:false,auto:-1,caught:0,hx:st.x,hy:st.y});
 grabEl.setPointerCapture(e.pointerId);grabEl.dataset.held='';tracker.reset();tracker.push(p.x,p.y);
 const move=ev=>{const q=point(ev);st.hx=clamp(q.x+ox,LIFT,FW-LIFT);st.hy=clamp(q.y+oy,LIFT,FH-LIFT);tracker.push(q.x,q.y)};
 const up=()=>{if(!st.held)return;st.held=false;st.air=true;const v=tracker.velocity(),sp=Math.hypot(v.x,v.y),k=sp>V_MAX?V_MAX/sp:1;
  if(sp>30){st.vx=v.x*k;st.vy=v.y*k}delete grabEl.dataset.held;
  ['pointermove','pointerup','pointercancel','lostpointercapture'].forEach((n,i)=>grabEl.removeEventListener(n,i?up:move))};
 grabEl.addEventListener('pointermove',move);['pointerup','pointercancel','lostpointercapture'].forEach(n=>grabEl.addEventListener(n,up));
});
function send(date){
 const i=st.cells.findIndex(c=>c.date===date);if(i<0||st.held)return;
 if(reduce.matches){setValue(date);home(false);return}
 if(st.rest&&st.at===i){setValue(date);return}
 Object.assign(st,{auto:i,autoT:0,caught:0,rest:false});
}
gridEl.addEventListener('click',e=>{const b=e.target.closest('.bb-day');if(b){focusKey=b.dataset.value;send(b.dataset.value)}});
gridEl.addEventListener('keydown',e=>{
 const b=e.target.closest('.bb-day');if(!b)return;
 const [y,m,d]=b.dataset.value.split('-').map(Number);let n=null;
 const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
 if(mv)n=addDays(y,m,d,mv);
 else if(e.key==='Home')n=addDays(y,m,d,-new Date(y,m-1,d).getDay());
 else if(e.key==='End')n=addDays(y,m,d,6-new Date(y,m-1,d).getDay());
 else if(e.key==='PageUp'||e.key==='PageDown'){const dt=new Date(y,m-1+(e.key==='PageUp'?-1:1),1);n=[dt.getFullYear(),dt.getMonth()+1,Math.min(d,dim(dt.getFullYear(),dt.getMonth()+1))]}
 if(!n)return;e.preventDefault();
 const k=key(...n);focusKey=k;
 if(n[0]!==month.y||n[1]!==month.m){goMonth(n[0],n[1],k,true)}
 else{gridEl.querySelectorAll('.bb-day').forEach(x=>x.tabIndex=x.dataset.value===k?0:-1)}
 const f=gridEl.querySelector(`[data-value="${k}"]`);if(f)f.focus();
});
function goMonth(y,m,sel,keepFocus){
 month={y,m};
 const keep=value.startsWith(`${y}-${pad(m)}`);
 if(!keep)value=sel||(y===ty&&m===tm?key(ty,tm,td):key(y,m,1));
 if(!focusKey.startsWith(`${y}-${pad(m)}`))focusKey=value;
 renderGrid();renderCaption();measure();home(!keep);
 if(keepFocus){const f=gridEl.querySelector(`[data-value="${focusKey}"]`);if(f)f.focus()}
}
document.getElementById('prev').onclick=()=>{const dt=new Date(month.y,month.m-2,1);goMonth(dt.getFullYear(),dt.getMonth()+1)};
document.getElementById('next').onclick=()=>{const dt=new Date(month.y,month.m,1);goMonth(dt.getFullYear(),dt.getMonth()+1)};
document.getElementById('todayBtn').onclick=()=>{const k=key(ty,tm,td);if(month.y===ty&&month.m===tm){focusKey=k;send(k)}else{value=k;focusKey=k;goMonth(ty,tm,k)}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// ================= boot =================
renderGrid();renderCaption();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{measure();home(true)});
measure();home(false);
</script>
